{% load static %}
<!doctype html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>login</title>
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css'%}">
</head>
<body>



<div class="container vh-100 d-flex justify-content-center align-items-center">
               <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width:420px; width:100%">

                       <div class="text-center mb-4">
                           <div class="mb-3">
                               <i class="bi bi-person-lock display-3 text-primary login-icon"></i>
                               </div>
                               <h2 class="fw-bold  mt-3">
                                       Owner Login
                               </h2>
                               <p class="text-muted">
                                       Sign in to access your dashboard.
                               </p>
                       </div>

                       <form method="POST">
                               {% csrf_token %}
                               <div class="mb-3">
                                       <label class="form-label">Username</label>
                                       <input type="text" name="username"  class="form-control"
                                       placeholder="Enter your username">
                               </div>

                               <div class="mb-4">
                                       <label class="form-label">Password</label>
                                   <div class="input-group">
                                       <input type="password" name="password" class="form-control"
                                       placeholder="Enter your password" id="password" >

                                   <button class="btn btn-outline-secondary px-3" type="button"
                                   onclick="togglePassword()">
                                       <i class="bi bi-eye" id="eyeIcon"></i>
                                   </button>
                                       </div>
                               </div>

                              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
                                  <i class="bi bi-box-arrow-in-right me-2"></i>
                                      Login
                              </button>
                       </form>
               </div>
       </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function togglePassword(){
        const password= document.getElementById("password");
        const eye = document.getElementById("eyeIcon");

        if(password.type === "password"){
        password.type="text";
        eye.classList.remove("bi-eye");
        eye.classList.add("bi-eye-slash");
        }
        else
        {
        password.type="password";
        eye.classList.remove("bi-eye-slash");
        eye.classList.add("bi-eye");
        }
        }
    </script>
</body>
</html>
