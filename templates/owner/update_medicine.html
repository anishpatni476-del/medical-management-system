{% extends 'owner/owner_base.html' %}
{% load static %}

{% block title %}
update_medicine
{% endblock %}


{% block content %}
       <div class="container-fluid">
            <div class="card shado-sm border-0 rounded-4">
                <div class="card-header bg-white">

                    <h4> <i class="bi bi-capsule-pill me-2 text-success d-flex"></i> Update Medicine</h4>
                </div>

                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Medicine Name
                                </label>
                                <input class="form-control" type="text" placeholder="Enter Medicine Name" name="medicine_name"
                                value="{{ medicine.medicine_name }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Category
                                </label>
                                 <select class="form-select" name="category" required>
                                    <option value="">Select Category</option>
                                    {% for category in categories %}
                                    <option value="{{ category.id }}"
                                    {% if medicine.category.id == category.id %}selected{% endif %}>
                                    {{ category.category_name }}
                                          </option>
                                    {% endfor %}
                                </select>

                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Company Name
                                </label>
                                <input class="form-control" type="text" placeholder="Enter Company Name" name="company_name"
                                value="{{ medicine.company_name }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Batch Number
                                </label>
                                <input class="form-control" type="text" placeholder="Enter Batch Number" name="batch_no"
                                value="{{ medicine.batch_no }}">
                            </div>

                             <div class="col-md-6 mb-3">
                                <label class="form-label">
                                  Stock Quantity
                                </label>
                                <input class="form-control" type="text" placeholder="Enter Stock Qty" name="stock_quantity"
                                value="{{ medicine.stock_quantity }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label d-flex">
                                    Purchase Price
                                </label>
                                <input type="number" class="form-control" placeholder="Enter Purchase Price" name="purchase_price"
                                value="{{ medicine.purchase_price }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label d-flex">
                                    Selling Price
                                </label>
                                <input type="number" class="form-control" placeholder="Enter Selling Price" name="selling_price"
                                value="{{ medicine.selling_price }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                  Minimum Stock
                                </label>
                                <input type="number" class="form-control" placeholder="Enter Minimum Stock" name="minimum_stock"
                                value="{{ medicine.minimum_stock }}">
                            </div>

                             <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Manufacturing Date
                                </label>
                                <input class="form-control" type="date" name="manufacturing_date"
                                value="{{ medicine.manufacturing_date|date:'Y-m-d' }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Expiry Date
                                </label>
                                <input class="form-control" type="date" name="expiry_date"
                                value="{{ medicine.expiry_date|date:'Y-m-d' }}">
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Supplier
                                </label>
                                <select class="form-select" name="supplier" required>
                                    <option value="">Select Supplier</option>
                                    {% for supplier in suppliers %}
                                    <option value="{{ supplier.id }}"
                                    {% if medicine.supplier.id == supplier.id %}selected{% endif %}
                                    >{{ supplier.company_name }}</option>
                                    {% endfor %}
                                </select>

                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Medicine Image
                                </label>
                                <input class="form-control" type="file" name="medicine_image" accept="image/*">
                            </div>

                            <div class=" col-md-12 mb-3">
                                <label class="form-label">
                                    Description
                                </label>
                                <textarea class="form-control" placeholder="Place Description" rows="3" name="description">{{ medicine.description }}
                                </textarea>
                            </div>

                            <div class="mt-4">
                              <button type="submit" class="btn btn-success ">
                                  <i class="bi bi-arrow-clockwise me-2"></i>
                                    Update
                                </button>
                                <a href="{% url 'owner_medicines' %}" class="btn btn-secondary ms-2">
                                    <i class="bi bi-x-circle me-2"></i>
                                    Cancel
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
         </div>
{% endblock %}
