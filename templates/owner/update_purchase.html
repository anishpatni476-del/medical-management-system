{% extends 'owner/owner_base.html' %}
{% load static %}

{% block title %}
update purchase
{% endblock %}

{% block content %}


             <div class="container-fluid">
            <div class="card shado-sm border-0 rounded-4">
                <div class="card-header bg-white">

                    <h4> <i class="bi bi-cart-plus me-2 text-success d-flex"></i> Update Purchase</h4>
                </div>

                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Supplier
                                </label>
                              <select class="form-select" name="supplier" required>
                                  {% for supplier in suppliers %}
                                  <option value="{{ supplier.id }}" {% if supplier.id == purchase.supplier.id %} selected {% endif %}>
                                      {{ supplier.company_name }}
                                  </option>
                                  {% endfor %}
                              </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Medicine
                                </label>
                                <select class="form-select" name="medicine" required>
                                    {% for medicine in medicines %}
                                    <option value="{{ medicine.id }}" {% if medicine.id == purchase.medicine.id %} selected {% endif %}>
                                        {{ medicine.medicine_name }}</option>
                                    {% endfor %}
                                </select>

                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Invoice Number
                                </label>
                                <input class="form-control" type="text" placeholder="Enter Invoice Number" name="invoice_number" value="{{ purchase.invoice_number }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Purchase_price
                                </label>
                                <input class="form-control" type="number" step="0.01" placeholder="Enter Purchase Price" name="purchase_price" required
                                value="{{ purchase.purchase_price }}">
                            </div>

                             <div class="col-md-6 mb-3">
                                <label class="form-label">
                                  Quantity
                                </label>
                                <input class="form-control" type="number" placeholder="Enter Quantity " name="quantity" required value="{{ purchase.quantity }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label d-flex">
                                    GST (%)
                                </label>
                                <select class="form-select" name="gst_percentage">

                                    <option value="0" {% if purchase.gst_percentage == 0 %} selected {% endif %}>0%</option>
                                    <option value="5" {% if purchase.gst_percentage == 5 %} selected {% endif %}>5%</option>
                                    <option value="12" {% if purchase.gst_percentage == 12 %} selected {% endif %}>12%</option>
                                    <option value="18" {% if purchase.gst_percentage == 18 %} selected {% endif %}>18%</option>
                                    <option value="28" {% if purchase.gst_percentage == 28 %} selected {% endif %}>28%</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label d-flex">
                                    Purchase Date
                                </label>
                                <input type="date" class="form-control" placeholder="Enter Purchase Date" name="purchase_date" value="{{ purchase.purchase_date|date:'Y-m-d' }}">
                            </div>


                            <div class="mt-4">
                                <button type="submit" class="btn btn-success ">
                                     <i class="bi bi-arrow-clockwise me-2"></i>
                                    Update
                                </button>
                                <a href="{% url 'purchase_list' %}" class="btn btn-secondary ms-2">
                                     <i class="bi bi-x-circle me-2"></i>
                                    Cancel
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
         </div>

{% endblock %}
