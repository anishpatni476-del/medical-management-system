{% extends 'owner/owner_base.html' %}
{% load static %}

{% block title %}
update category
{% endblock %}

{% block content %}

           <div class="container-fluid">
            <div class="card shado-sm border-0 rounded-4">
                <div class="card-header bg-white">

                    <h4> <i class="bi bi-plus-circle me-2 text-success d-flex"></i> Update Category</h4>
                </div>

                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">

                            <label class="form-label">
                                Category Name
                            </label>
                            <input class="form-control" type="text" placeholder="Enter Category Name" value="{{ category.category_name }}"
                            name="category_name" autofocus onfocus="this.select()">
                        </div>

                         <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>
                           <textarea class="form-control" rows="3"
                                     placeholder="Enter Description"
                                     name="description"
                           autofocus onfocus="this.select()">{{ category.description }}</textarea>
                        </div>

                        <div class="mb-3 d-flex">
                           <select class="form-select" name="status">
                                <option value="">Select Status</option>
                                <option value="Active" {% if category.status == "Active" %}selected{% endif %}>Active</option>
                                <option value="Inactive" {% if category.status == "Inactive" %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>

                        <button class="btn btn-success">
                            <i class="bi bi-arrow-clockwise me-2"></i>
                           Update
                        </button>
                        <a href="{% url 'owner_category' %}" class="btn btn-secondary ms-2">
                            <i class="bi bi-x-circle me-2"></i>
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
{% endblock %}
