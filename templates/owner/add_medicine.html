{% extends 'owner/owner_base.html' %}
{% load static %}

{% block title %}
add_medicine
{% endblock %}

{% block content %}

         <div class="container-fluid">
            <div class="card shado-sm border-0 rounded-4">
                <div class="card-header bg-white">

                    <h4> <i class="bi bi-capsule-pill me-2 text-success d-flex"></i> Add New Medicine</h4>
                </div>

                <div class="card-body">
                    {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
                        {{ message }}
                        <button class="btn-close" type="button" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                    {% endif %}
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Medicine Name
                                </label>
                                <input class="form-control" type="text" placeholder="Enter Medicine Name" name="medicine_name"
                                value="{{ form_data.medicine_name }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Category
                                </label>
                                <select class="form-select" name="category" required>
                                    <option value="">Select Category</option>
                                    {% for category in categories %}
                                    <option value="{{ category.id }}" {% if selected_category == category.id|stringformat:"s" %}selected{% endif %}>{{ category.category_name }}</option>
                                    {% endfor %}
                                </select>

                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Company Name
                                </label>
                                <input class="form-control" type="text" placeholder="Enter Company Name" name="company_name"
                                value="{{ form_data.company_name }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Batch Number
                                </label>
                                <input class="form-control" type="text" placeholder="Enter Batch Number" name="batch_no"
                                value="{{ form_data.batch_no }}">
                            </div>

                             <div class="col-md-6 mb-3">
                                <label class="form-label">
                                  Stock Quantity
                                </label>
                                <input class="form-control" type="text" placeholder="Enter Stock Qty" name="stock_quantity"
                                value="{{ form_data.stock_quantity }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label d-flex">
                                    Purchase Price
                                </label>
                                <input type="number" class="form-control" placeholder="Enter Purchase Price" name="purchase_price"
                                value="{{ form_data.purchase_price }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label d-flex">
                                    Selling Price 
                                </label>
                                <input type="number" class="form-control" placeholder="Enter Selling Price" name="selling_price"
                                value="{{ form_data.selling_price }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                  Minimum Stock
                                </label>
                                <input type="number" class="form-control" placeholder="Enter Minimum Stock" name="minimum_stock"
                                value="{{ form_data.minimum_stock }}">
                            </div>

                             <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Manufacturing Date
                                </label>
                                <input class="form-control" type="date" name="manufacturing_date"
                                value="{{ form_data.manufacturing_date }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Expiry Date
                                </label>
                                <input class="form-control" type="date" name="expiry_date"
                                value="{{ form_data.expiry_date }}">
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Supplier
                                </label>
                                <select class="form-select" name="supplier" required>
                                    <option value="">Select Supplier</option>
                                    {% for supplier in suppliers %}
                                    <option value="{{ supplier.id }}" {% if selected_supplier == supplier.id|stringformat:"s" %}selected{% endif %}>{{ supplier.company_name }}</option>
                                    {% endfor %}
                                </select>

                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Medicine Image
                                </label>
                                <input class="form-control" type="file" name="medicine_image" accept="image/*">
                            </div>

                            <div class=" col-md-12 mb-3">
                                <label class="form-label">
                                    Description
                                </label>
                                <textarea class="form-control" placeholder="Place Description" rows="3" name="description">{{ form_data.description }}</textarea>
                            </div>

                            <div class="mt-4">
                                <button type="submit" class="btn btn-success ">
                                    Save Medicine
                                </button>
                                <a href="{% url 'owner_medicines' %}" class="btn btn-secondary ms-2">
                                    Cancel
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
         </div>

{% endblock %}
