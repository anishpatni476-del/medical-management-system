{% extends 'owner/owner_base.html' %}
{% load static %}

{% block title %}
update_profile
{% endblock %}

{% block content %}

           <div class="container-fluid">
            <div class="card shado-sm border-0 rounded-4">
                <div class="card-header bg-white">

                    <h4> <i class="bi bi-person-gear me-2 text-dark d-flex"></i> Update Profile</h4>
                </div>

                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-4 text-center">
                            {% if profile.profile_photo %}
                            <img src="{{ profile.profile_photo.url }}"
                            class="rounded-circle border"
                            width="120"
                            height="120">
                            {% else %}
                            <img src="{% static 'images/profile.png' %}"
                            class="rounded-circle border"
                            width="120"
                            height="120">
                            {% endif %}

                            <div class="mt-3">
                                <label class="form-label">Profile Photo</label>
                                <input type="file" class="form-control" name="profile_photo">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" name="first_name" value="{{ request.user.first_name }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" name="last_name" value="{{ request.user.last_name }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" name="username" value="{{ request.user.username }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" name="email" value="{{ request.user.email }}" >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mobile Number</label>
                                <input type="text" class="form-control" name="mobile_number" value="{{ profile.mobile_number }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Medical Store Name </label>
                                <input type="text" class="form-control" name="medical_store_name" value="{{ profile.medical_store_name }}">
                            </div>

                            <div class="col-md-12 mb-3">
                                <label class="form-label">Medical Store Address</label>
                                <textarea class="form-control" rows="3" name="medical_store_address">{{ profile.medical_store_address }}</textarea>

                            </div>

                            <div class="col-md-12 mb-3">
                                <label class="form-label"> Business Hours</label>
                                <textarea class="form-control" rows="3" name="business_hours">{{ profile.business_hours }}</textarea>
                            </div>

                        </div>



                        <button class="btn btn-success">
                             <i class="bi bi-check-circle me-2"></i>
                           Save changes
                        </button>
                        <a href="{% url 'owner_profile' %}" class="btn btn-secondary ms-2">
                            <i class="bi bi-x-circle me-2"></i>
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>

{% endblock %}
